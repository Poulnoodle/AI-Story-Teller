name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 与本机（Windows, npm 11）保持一致
          node-version: 24
          cache: npm
      - run: npm install -g npm@11
      # 注意：不能用 npm ci —— Windows 上 npm 11 生成 lockfile 时会按平台裁剪
      # 外平台可选依赖的 peer 条目（@napi-rs/wasm-runtime → @emnapi/*），
      # Linux 上 npm 校验时要求它们存在，跨平台 npm ci 必然报 EUSAGE。
      # npm install 不校验 lockfile 同步，从 registry 按平台现场解析，永久免疫。
      - run: npm install --no-audit --no-fund
      - name: Build static site
        env:
          # NEXT_PUBLIC_* 在构建期内联进公开 JS 包：
          # 密钥缺失时为空字符串，页面密码回退默认值、搜索自动降级 LLM 生成，构建不失败
          NEXT_PUBLIC_TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
          NEXT_PUBLIC_AUTH_PASSWORD: ${{ secrets.NEXT_PUBLIC_AUTH_PASSWORD }}
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
